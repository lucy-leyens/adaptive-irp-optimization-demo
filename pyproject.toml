[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-irp-optimization-demo"
version = "0.1.0"
description = "Portfolio demo: adaptive heuristic selection with LP and minimum-cost-flow quantity reoptimization for an Inventory Routing Problem."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "PyYAML>=6.0",
  "matplotlib>=3.8",
  "pyscipopt>=5.0",
  "ortools>=9.10"
]

[project.scripts]
irp-demo = "irp_demo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
